[project]
name = "rca-agent"
version = "0.1.0"
description = "Stateful Root Cause Analysis Agent using LangGraph and MCP Tool Servers"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
    "langchain-openai>=0.3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]
