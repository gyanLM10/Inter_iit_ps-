# Loki single-binary mode for lightweight log aggregation in kind
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 2h
    max_query_length: 1h

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  enabled: false

# Disable unnecessary components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Enable Promtail to collect logs
minio:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
